<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>swipe</title>
  </head>
  <link rel="stylesheet" href="main.css" />
  <body>
    <div class="fliegende-Hexe">
      <img src="bilder/witch-on-broom.gif" alt="fliegende Sabberhexe" />
    </div>

    <button id="menu-button" aria-label="Menü öffnen">☰</button>

    <nav id="menu" class="hidden">
      <ul>
        <li><a href="index.html">Startseite</a></li>
        <li><a href="team.html">Über uns</a></li>
        <li><a href="profil.html">Profil erstellen</a></li>
      </ul>
    </nav>

    <script>
      const btn = document.getElementById("menu-button");
      const menu = document.getElementById("menu");

      btn.addEventListener("click", () => {
        menu.classList.toggle("hidden");
      });
    </script>

    <div class="huete">
      <h1>
        a h s h j v h f i f n m f b c k f b n f h d j d o d m d b d h f n f j d
        m t o h g f n
      </h1>
    </div>

    <div class="countainer">
      <div class="spalte1">
        <div class="sternenhimmel">
          <img src="bilder/sternenhimmel.gif" alt="sternenhimmel" />
        </div>
      </div>

      <div class="spalte2">
        <div class="ueberschrift"><h1>Hex und Herz</h1></div>
        <div class="unter-ueberschrift2">
          <h2>
            Hier findest du die grässlichsten Sabberhexen in deiner Gegend!
          </h2>
        </div>

        <div class="fenster">
          <div class="anmeldung2">
            <h2 id="hexenBild">Hexen Highlight:</h2>
            <h2 id="hexenName">Name:</h2>
            <h2 id="hexenAlter">Alter:</h2>
            <h2 id="hexenBio">Bio:</h2>

            <button id="sabbernButton">Zum Sabbern 🤤💖</button>
            <button id="weghexenButton">Weghexen 🪄✨</button>

            <button id="clearButton">fakeProfile löschen</button>

            <script>
              const defaultProfile = [
                {
                  username: "Besen-Berta01",
                  age: 254,
                  bio: "Mein frisierter Feuerblitz hat 600 PS und eine eingebaute Sitzheitzung. Suche einen furchtlosen Co-Piloten für wilde, nächtliche Besenritte. Wenn du dich traust, melde dich, aber ACHTUNG!!! wenn du mich nervst verzaubere ich deinen Porsche Cayenne in einen Fiat 500... 🧹💨",
                  bild: "bilder/Sabberhexe2.png",
                },
                {
                  username: "Mieze-Mechthilde77",
                  age: 591,
                  bio: "Ich komme im Doppelpack mit meinen 7 schwarzen Katzen. Namentlich Konrad, Hubertus, Archibald, Wilhelm, Helmut, Siegfried und Karl-Heinz. Wenn meine Katzen dich nicht mögen oder dir die Konkurenz zu stark ist, wirst du zu Katzenfutter verarbeitet. Ansonsten bin ich ganz zahm.",
                  bild: "bilder/Sabberhexe2.png",
                },
                {
                  username: "KesselKunigunde129",
                  age: 332,
                  bio: "Liebe geht bekanntlich durch den Magen - besonders wenn mein berüchtigeter Liebestrank drinn ist. Ich koche eine mordsmäßig-gute Fledermaus-Suppe, die dich garantiert umhauen wird. Suche einen mutigen Vorkoster für meine neuesten Kreationen, wobei eine hohe Lebenserwartung durchaus von Vorteil wäre ...",
                  bild: "bilder/Sabberhexe2.png",
                },
                {
                  username: "Hexe-Hildegard88",
                  age: 412,
                  bio: "Ich bin es so leid, allein in meinem windschiefen Knusperhäuschen zu hocken – ich suche doch einfach nur meinen Froschkönig zum Küssen! Ich esse übrigens auch seit gut einhundert Jahren keine Kinder mehr, sie lagen mir am Ende einfach viel zu schwer auf dem Magen. Heute bin ich total zahm und füttere dich lieber mit Kinderallternativen. Bitte wisch nach rechts, ich habe den Kessel schon für zwei Personen gedeckt.",
                  bild: "bilder/Sabberhexe2.png",
                },
              ];

              let eigeneProfile = [];
              try {
                const localDaten = localStorage.getItem("sabberProfile");
                if (localDaten) {
                  eigeneProfile = JSON.parse(localDaten);
                }
              } catch (e) {
                console.error("Fehler beim Laden:", e);
              }
              let gespeicherteHexen = [...eigeneProfile, ...defaultProfile];

              const hexenNamePlatzhalter = document.getElementById("hexenName");
              const hexenAlterPlatzhalter =
                document.getElementById("hexenAlter");
              const hexenBioPlatzhalter = document.getElementById("hexenBio");
              const hexenBildPlatzhalter = document.getElementById("hexenBild");

              let aktuellesProfilIndex = 0;

              function zeigeHexenProfil() {
                const aktuellesProfil = gespeicherteHexen[aktuellesProfilIndex];

                if (aktuellesProfil) {
                  hexenNamePlatzhalter.textContent =
                    "Name: " + aktuellesProfil.username;
                  hexenAlterPlatzhalter.textContent =
                    "Alter: " + aktuellesProfil.age;
                  hexenBioPlatzhalter.textContent =
                    "Bio: " + aktuellesProfil.bio;
                  hexenBildPlatzhalter.textContent =
                    "Hexen Highlight: " +
                    (aktuellesProfil.bild || "Kein Bild verfügbar");
                } else {
                  hexenNamePlatzhalter.textContent =
                    "Der Hexenkessel ist leer. Keine attraktiven Sabberhexen mehr in deiner Nähe.";
                  hexenAlterPlatzhalter.textContent = "";
                  hexenBioPlatzhalter.textContent = "";
                  hexenBildPlatzhalter.textContent = "";
                }
              }

              const sabbernButton = document.getElementById("sabbernButton");

              sabbernButton.addEventListener("click", function () {
                if (aktuellesProfilIndex < gespeicherteHexen.length) {
                  alert(
                    "✨ SABBER-ALARM! ✨ IT'S A MATCH! Du hast gerade ein magisches Sabber-Date mit " +
                      gespeicherteHexen[aktuellesProfilIndex].username +
                      " gefunden!",
                  );
                  aktuellesProfilIndex++;
                  zeigeHexenProfil();
                }
              });

              const weghexenButton = document.getElementById("weghexenButton");

              weghexenButton.addEventListener("click", function () {
                if (aktuellesProfilIndex < gespeicherteHexen.length) {
                  aktuellesProfilIndex++;
                  zeigeHexenProfil();
                }
              });

              zeigeHexenProfil();

              const clearButton = document.getElementById("clearButton");
              clearButton.addEventListener("click", function () {
                localStorage.removeItem("sabberProfile");
                location.reload();
              });
            </script>
          </div>

          <div class="liebeszug">
            <img id="liebeszug" src="bilder/katzen.gif" alt="katzen" />
          </div>
        </div>
      </div>

      <div class="spalte3">
        <div class="sternenhimmel">
          <img src="bilder/sternenhimmel.gif" alt="sternenhimmel" />
        </div>
      </div>
    </div>
  </body>
</html>
